services:
  - type: web
    name: microgridai-backend
    runtime: python
    rootDir: backend
    buildCommand: pip install -r requirements.txt && python -m app.ml.train_models
    startCommand: python -m uvicorn app.main:app --host 0.0.0.0 --port $PORT
    plan: free
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
